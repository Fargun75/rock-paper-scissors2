<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>

</head>

<body>

    <h1>This is a simple game of rock, paper and scissors.</h1>
    <h2>Make your choise - the first to get 5 points wins!</h2>
    <br>
    <div class="buttons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>
    <br />
    <br />

    <div id="result"></div>

    <div id="score"></div>

    <div id="winner"></div>

    <script src="./js/script.js"></script>
</body>

</html>
